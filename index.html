<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Application Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gray-100">
  <div class="mx-auto max-w-6xl px-4 py-10">

    <!-- Main panel -->
    <section class="rounded-2xl bg-white shadow-sm">
      <div class="px-4 py-6 sm:px-8">
        <h2 class="text-center text-base font-semibold text-slate-800">Job Application Tracker</h2>

        <!-- Dashboard -->
        <div class="mt-5 grid gap-3 sm:grid-cols-3">
          <div class="rounded-lg border border-slate-100 bg-white p-4">
            <p class="text-xs font-medium text-slate-500">Total</p>
            <p id="countTotal" class="mt-1 text-lg font-semibold text-slate-900">0</p>
          </div>

          <div class="rounded-lg border border-slate-100 bg-white p-4">
            <p class="text-xs font-medium text-slate-500">Interview</p>
            <p id="countInterview" class="mt-1 text-lg font-semibold text-emerald-600">0</p>
          </div>

          <div class="rounded-lg border border-slate-100 bg-white p-4">
            <p class="text-xs font-medium text-slate-500">Rejected</p>
            <p id="countRejected" class="mt-1 text-lg font-semibold text-rose-600">0</p>
          </div>
        </div>

        <!-- Available Jobs -->
        <div class="mt-8 flex items-center justify-between">
          <h3 class="text-sm font-semibold text-slate-800">Available Jobs</h3>
          <p class="text-xs text-slate-500"><span id="tabCount">0</span> jobs</p>
        </div>

        <!-- Tabs -->
        <div class="mt-3 flex flex-wrap gap-2">
          <button class="tab-btn rounded-md bg-blue-600 px-3 py-1.5 text-xs font-semibold text-white" data-tab="all">All</button>
          <button class="tab-btn rounded-md bg-slate-100 px-3 py-1.5 text-xs font-semibold text-slate-700 hover:bg-slate-200" data-tab="interview">Interview</button>
          <button class="tab-btn rounded-md bg-slate-100 px-3 py-1.5 text-xs font-semibold text-slate-700 hover:bg-slate-200" data-tab="rejected">Rejected</button>
        </div>

        <!-- Cards -->
        <div class="mt-4">
          <div id="cardsWrap" class="space-y-3"></div>

          <!-- Empty State -->
          <div id="emptyState" class="hidden rounded-xl border border-slate-100 bg-slate-50 px-4 py-10">
            <div class="mx-auto flex max-w-sm flex-col items-center text-center">
              <div class="mb-4 grid h-full w-full place-items-center ">
                <img src="jobs.png" alt="">
              </div>
              <p class="text-sm font-semibold text-slate-900">No jobs available</p>
              <p class="mt-1 text-xs text-slate-500">Check back soon for new job opportunities</p>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

    <script src="script.js"></script>
</body>
</html>
